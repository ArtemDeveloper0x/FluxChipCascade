name: flux_chip_cascade
description: "Flux Chip Cascade - arcade roguelike orbital survival game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.35.1
  flame_audio: ^2.11.14
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/Icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/Icon.png"
  adaptive_icon_foreground: "assets/icon_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
